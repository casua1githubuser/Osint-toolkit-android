plugins { id 'com.android.application' }
android {
 namespace 'com.osinttoolkit.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.osinttoolkit.app'
  minSdk 26
  targetSdk 35
  versionCode 22
  versionName '0.11.1-alpha'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.all { systemProperty 'catalog.path', file('src/main/assets/source-catalog.json').absolutePath } }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
